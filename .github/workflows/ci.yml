# Levlofit CI: runs the repository's own checks on every push and pull request. Read-only, no secrets.
#
# Jobs (all required; none uses continue-on-error or conditional skips):
#   flutter    analyze + full test suite (app/)
#   website    lint, typecheck, production build (website/)
#   functions  node:test suites for the Supabase Edge Function modules, the offline AI evaluation harness,
#              and a strict typecheck of the modules that do not depend on Deno
#   deno       Deno 2 typecheck and lint of the Edge Function entry points, plus a runtime smoke test (no network
#              beyond 127.0.0.1, dummy values only)
#   handbook   evidence-register tests, register + retrieval-passage freshness, that the committed Handbook
#              migration is exactly what data/build_handbook.py generates, the v4 draft book tests, and that the
#              food micronutrient migration matches data/build_food_micros.py
#   database   local Supabase stack on the runner (Docker), every migration applied from scratch, pgTAP tests
#
# Not run here, on purpose:
#   - Android APK builds: gradle.properties asks for an 8 GB heap, more than a standard hosted runner may give;
#     release builds need the owner's keystore, which must never be in CI here.
#   - Live AI provider evaluation: needs an API key; run.ts --live stays a manual, local step.
#
# Actions are pinned to full commit SHAs (resolved 2026-10-16 with git ls-remote; the comment names the tag or
# branch). Update them deliberately, re-resolving each SHA.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22.23.2'
  FLUTTER_VERSION: '3.47.5'
  PYTHON_VERSION: '3.12'

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Get packages (exactly as locked)
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub

  website:
    name: Website lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install (exactly as locked)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx --no-install tsc --noEmit --incremental false
      - name: Build
        run: npm run build

  functions:
    name: Edge Function modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install TypeScript and Node types (from the website lockfile)
        run: npm ci --prefix website
      - name: Unit and contract tests
        # Listed explicitly: a missing or renamed test file fails the job instead of being skipped.
        run: |
          node --test \
            supabase/functions/_shared/plan-engine.test.ts \
            supabase/functions/_shared/llm.test.ts \
            supabase/functions/_shared/handbook.test.ts \
            supabase/functions/coach-chat/coach-chat.test.ts \
            supabase/functions/delete-account/delete-account.test.ts \
            supabase/functions/generate-plan/generate-plan.test.ts \
            supabase/functions/_eval/eval.test.ts
      - name: AI evaluation (scripted provider, offline; exits 1 on any strict failure)
        run: node supabase/functions/_eval/run.ts
      - name: Strict typecheck of modules that run without Deno
        run: |
          website/node_modules/.bin/tsc --noEmit --strict --target es2022 --module esnext --moduleResolution bundler \
            --allowImportingTsExtensions --resolveJsonModule --lib es2022,dom --types node \
            --typeRoots website/node_modules/@types \
            supabase/functions/_shared/*.ts \
            supabase/functions/_eval/personas.ts supabase/functions/_eval/score.ts supabase/functions/_eval/cases.ts

  deno:
    name: Edge Functions under Deno
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Typecheck entry points
        run: deno check --lock=_test/deno.lock --frozen coach-chat/index.ts generate-plan/index.ts delete-account/index.ts
      - name: Lint entry points and shared modules
        run: deno lint coach-chat/index.ts generate-plan/index.ts delete-account/index.ts _shared/coach-context.ts _shared/llm.ts _shared/handbook.ts _shared/rate.ts _shared/plan-engine.ts _test/deno-smoke.ts
      - name: Runtime smoke test (dummy values, network limited to 127.0.0.1)
        run: deno run --lock=_test/deno.lock --frozen --allow-env --allow-read --allow-net=127.0.0.1 _test/deno-smoke.ts

  handbook:
    name: Handbook evidence register
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Register tooling tests
        run: python -I data/evidence/test_extract_claims.py -v
      - name: Register and retrieval passages are in sync with the Handbook
        run: python -I data/evidence/extract_claims.py --check
      - name: Committed Handbook migration matches the builder
        run: |
          python -I data/build_handbook.py
          git diff --exit-code -- supabase/migrations/20261007400000_handbook_v3.sql
      - name: Handbook v4 draft book tests
        run: python -I data/handbook_v4/test_book.py
      - name: Committed food micronutrient migration matches the builder
        run: |
          python -I data/build_food_micros.py
          git diff --exit-code -- supabase/migrations/20261016200000_food_micronutrients.sql
      - name: The checks above changed no tracked file
        run: git diff --exit-code

  database:
    name: Database migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.118.0
      - name: Start the database only (all migrations from scratch, on the runner)
        run: supabase db start
      - name: pgTAP tests
        run: supabase test db --local
